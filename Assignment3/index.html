<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Management Application</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Data Management Application</h1>
      <div class="banner">
        NAME: RUSHITABEN PRAVINBHAI VACHHANI </br> NUID: 002034308
      </div>
    </header>

    <table id="myTable" aria-label="Student Awards Table">
      <caption>
        Student Awards
      </caption>
      <thead>
        <tr>
          <th>Controls</th>
          <th>STUDENT</th>
          <th>ADVISOR</th>
          <th>AWARD STATUS</th>
          <th>SEMESTER</th>
          <th>TYPE</th>
          <th>BUDGET #</th>
          <th>PERCENTAGE</th>
          <th>DELETE</th>
          <th>EDIT</th>
        </tr>
      </thead>
      <tbody>
        <!-- Seed row -->
        <tr class="data-row">
          <td class="ctrl-cell">
            <button
              class="expand-btn"
              title="Expand row"
              aria-label="Expand row"
              aria-expanded="false"
            >
              <img src="assets/down.png" alt="" class="expand-icon" />
            </button>
            <input type="checkbox" class="row-check" aria-label="Select row" />
          </td>
          <td class="student">Student 1</td>
          <td class="advisor">Teacher 1</td>
          <td>Approved</td>
          <td>Fall</td>
          <td>TA</td>
          <td class="budget">12345</td>
          <td>100%</td>
          <td class="delete-cell"></td>
          <td class="edit-cell"></td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="10" class="table-actions">
            <button id="submitBtn" disabled>SUBMIT SELECTED AWARDS</button>
            <button id="addBtn" type="button">Add New Student</button>
          </td>
        </tr>
      </tfoot>
    </table>
    

    <form id="feedbackForm" style="margin:16px 0;max-width:520px" novalidate>
  <div style="display:grid;gap:8px;">
    <label>Name
      <input id="fbName" name="name" required />
    </label>
    <label>Email
      <input id="fbEmail" name="email" type="email" required />
    </label>
    <label>Feedback
      <textarea id="fbMsg" name="message" rows="4" required></textarea>
    </label>
    <button type="submit">Submit</button>
  </div>
</form>

  </body>
</html>
