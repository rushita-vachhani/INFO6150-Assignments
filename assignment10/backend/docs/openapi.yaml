openapi: 3.0.0
info:
  title: Assignment 10 - Admin & Employee Portal API
  description: API for secure user, auth, jobs, images with role-based access.
  version: 2.0.0

servers:
  - url: http://localhost:4000

paths:

  /user/create:
    post:
      summary: Create User (Admin or Employee)
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, password, type]
              properties:
                fullName:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                type:
                  type: string
                  enum: [admin, employee]
      responses:
        "201":
          description: User created
        "400":
          description: Validation error

  /auth/login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              example:
                message: "Login successful"
                token: "jwt-token"
        "401":
          description: Invalid credentials

  /user/edit:
    put:
      summary: Edit User
      tags: [User]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                fullName:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Updated
        "404":
          description: User not found

  /user/delete:
    delete:
      summary: Delete User
      tags: [User]
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        "200":
          description: Deleted
        "404":
          description: User not found

  /user/uploadImage:
    post:
      summary: Upload Profile Image
      tags: [User]
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [email, image]
              properties:
                email:
                  type: string
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Image uploaded

  /user/getAll:
    get:
      summary: Get All Users 
      tags: [User]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of users

  /api/users:
    get:
      summary: Admin - Get All Users (Without Password)
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Clean user list

  /api/create/job:
    post:
      summary: Admin - Create Job
      tags: [Jobs]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company, title, description, salary]
              properties:
                company:
                  type: string
                title:
                  type: string
                description:
                  type: string
                salary:
                  type: number
      responses:
        "201":
          description: Job created

  /api/jobs:
    get:
      summary: Get All Jobs
      tags: [Jobs]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of jobs

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
        type:
          type: string
          enum: [admin, employee]
