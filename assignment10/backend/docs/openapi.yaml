openapi: 3.0.0
info:
  title: Assignment 10 - Admin & Employee Portal API
  description: Secure API for users, authentication, images, and job management with role-based access.
  version: 2.0.0

servers:
  - url: http://localhost:4000

tags:
  - name: User
    description: User account & profile management
  - name: Auth
    description: Authentication endpoints
  - name: Jobs
    description: Job listings and management
  - name: Admin
    description: Admin-only operations

paths:

  ###############################################
  # USER CREATE
  ###############################################
  /user/create:
    post:
      summary: Create User (Admin or Employee)
      tags: [User]
      description: |
        Allows creation of a new **admin** or **employee** user.  
        *Only admins should call this in real apps, but for assignment usage, no restriction is enforced.*
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, password, type]
              properties:
                fullName:
                  type: string
                  example: "Rushitaben Vachhani"
                email:
                  type: string
                  example: "rv@northeastern.edu"
                password:
                  type: string
                  example: "Nu#4106522"
                type:
                  type: string
                  enum: [admin, employee]
                  example: "admin"
      responses:
        "201":
          description: User created
          content:
            application/json:
              example:
                message: "User created successfully."
        "400":
          description: Validation failed
          content:
            application/json:
              example:
                error: "User already exists."

  ###############################################
  # LOGIN
  ###############################################
  /auth/login:
    post:
      summary: Login
      tags: [Auth]
      description: |
        Authenticates a user and returns a JWT token.  
        Token payload includes **email, sub (userId), type (admin/employee)**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: "rv@northeastern.edu"
                password:
                  type: string
                  example: "Nu#4106522"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                message: "Login successful"
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                user:
                  email: "admin@test.com"
                  type: "admin"
        "401":
          description: Invalid email or password
          content:
            application/json:
              example:
                error: "Invalid credentials"

  ###############################################
  # EDIT USER
  ###############################################
  /user/edit:
    put:
      summary: Edit User
      tags: [User]
      security:
        - bearerAuth: []
      description: Updates fullName or password for a user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  example: "john@test.com"
                fullName:
                  type: string
                  example: "John Smith"
                password:
                  type: string
                  example: "NewPass@123"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              example:
                message: "User updated successfully"
        "404":
          description: Not found
          content:
            application/json:
              example:
                error: "User not found."

  ###############################################
  # DELETE USER
  ###############################################
  /user/delete:
    delete:
      summary: Delete User
      tags: [User]
      security:
        - bearerAuth: []
      description: Deletes a user by email.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  example: "employee@test.com"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              example:
                message: "User deleted successfully."
        "404":
          description: Not found
          content:
            application/json:
              example:
                error: "User not found."

  ###############################################
  # UPLOAD IMAGE
  ###############################################
  /user/uploadImage:
    post:
      summary: Upload Profile Image
      tags: [User]
      security:
        - bearerAuth: []
      description: Upload a profile image for a user.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [email, image]
              properties:
                email:
                  type: string
                  example: "john@test.com"
                image:
                  type: string
                  format: binary
      responses:
        "201":
          description: Image uploaded
          content:
            application/json:
              example:
                message: "Image uploaded successfully"
                filePath: "/images/173205-profile.jpg"
        "400":
          description: Bad upload
          content:
            application/json:
              example:
                error: "Invalid file format. Only JPEG, PNG, and GIF are allowed."

  ###############################################
  # GET ALL USERS
  ###############################################
  /user/getAll:
    get:
      summary: Get All Users (Password Included - Assignment Use Only)
      tags: [User]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              example:
                users:
                  - fullName: "Admin User"
                    email: "admin@test.com"
                    password: "$2b$10$encrypted"
                  - fullName: "Employee A"
                    email: "emp@test.com"
                    password: "$2b$10$encrypted"

  ###############################################
  # ADMIN: GET CLEAN USERS LIST
  ###############################################
  /api/users:
    get:
      summary: Admin - Get All Users (No Password)
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Clean user list for admin
          content:
            application/json:
              example:
                - fullName: "Admin User"
                  email: "admin@test.com"
                  type: "admin"
                - fullName: "Employee Bob"
                  email: "bob@test.com"
                  type: "employee"

  ###############################################
  # ADMIN: CREATE JOB
  ###############################################
  /api/create/job:
    post:
      summary: Admin - Create Job
      tags: [Jobs]
      security:
        - bearerAuth: []
      description: Admin-only job creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company, title, description, salary]
              properties:
                company:
                  type: string
                  example: "Google"
                title:
                  type: string
                  example: "Frontend Developer"
                description:
                  type: string
                  example: "React + Node Developer"
                salary:
                  type: number
                  example: 150000
      responses:
        "201":
          description: Job created
          content:
            application/json:
              example:
                message: "Job created successfully"

  ###############################################
  # GET ALL JOBS
  ###############################################
  /api/jobs:
    get:
      summary: Get All Jobs
      tags: [Jobs]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              example:
                jobs:
                  - company: "Apple"
                    title: "iOS Developer"
                    salary: 180000
                    description: "Swift, UIKit, MVVM"
                  - company: "Meta"
                    title: "React Developer"
                    salary: 160000
                    description: "React, GraphQL, Webpack"

components:

  ##############################
  # SECURITY
  ##############################
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  ##############################
  # SCHEMAS
  ##############################
  schemas:

    LoginResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        user:
          type: object
          properties:
            email:
              type: string
            type:
              type: string
              enum: [admin, employee]

    User:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
        type:
          type: string
          enum: [admin, employee]

    Error:
      type: object
      properties:
        error:
          type: string
