openapi: 3.0.0
info:
  title: Assignment 10 - Admin & Employee Portal API
  description: Secure API for users, authentication, images, and job management.
  version: 2.0.0

servers:
  - url: http://localhost:4000
    description: Local development server

paths:
  /user/create:
    post:
      summary: Create User
      description: Create a new user (admin or employee). Email must be unique.
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                type:
                  type: string
                  enum: [admin, employee]
                  description: User role
              required:
                - fullName
                - email
                - password
                - type
            example:
              fullName: "Rushitaben Vachhani"
              email: "rv@northeastern.edu"
              password: "Nu#4106522"
              type: "admin"
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              example:
                message: "User created successfully"
        '400':
          description: Bad Request - User already exists or invalid type
          content:
            application/json:
              example:
                error: "User already exists."

  /auth/login:
    post:
      summary: Login
      description: Authenticate user and return a JWT token.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
            example:
              email: "rv@northeastern.edu"
              password: "Nu#4106522"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              example:
                message: "Login successful"
                token: "jwt-token-here"
        '401':
          description: Invalid credentials
          content:
            application/json:
              example:
                message: "Invalid credentials"

  /user/edit:
    put:
      summary: Edit User
      description: Update a user's name or password (email cannot be changed).
      tags:
        - User
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                fullName:
                  type: string
                password:
                  type: string
            example:
              email: "rv@northeastern.edu"
              fullName: "Rushita V."
              password: "NewP@ssw0rd"
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              example:
                message: "User updated successfully"
        '404':
          description: User not found
          content:
            application/json:
              example:
                message: "User not found"

  /user/delete:
    delete:
      summary: Delete User
      description: Delete a user by email.
      tags:
        - User
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
            example:
              email: "rv@northeastern.edu"
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              example:
                message: "User deleted successfully"
        '404':
          description: User not found
          content:
            application/json:
              example:
                message: "User not found"

  /user/getAll:
    get:
      summary: Get All Users
      description: Returns list of users including hashed password.
      tags:
        - User
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of all users
          content:
            application/json:
              example:
                users:
                  - fullName: "Rushitaben Vachhani"
                    email: "rv@northeastern.edu"

  /users:
    get:
      summary: Admin - Get All Users (password excluded)
      description: Fetch all users except their password. Admin access required.
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of sanitized users
          content:
            application/json:
              example:
                - fullName: "John Doe"
                  email: "john@example.com"
                  type: "employee"

  /user/uploadImage:
    post:
      summary: Upload Image
      description: Upload a user's profile image (JPEG, PNG, GIF only).
      tags:
        - User
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                email:
                  type: string
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: Image uploaded
          content:
            application/json:
              example:
                message: "Image uploaded successfully"
                filePath: "/images/image1.png"
        '400':
          description: Invalid file or already exists
        '404':
          description: User not found

  /create/job:
    post:
      summary: Admin - Create Job
      description: Creates a job (admin only).
      tags:
        - Jobs
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                company:
                  type: string
                title:
                  type: string
                description:
                  type: string
                salary:
                  type: number
            example:
              company: "Google"
              title: "Frontend Developer"
              description: "React + Node Developer"
              salary: 150000
      responses:
        '201':
          description: Job created
          content:
            application/json:
              example:
                message: "Job created successfully"

  /jobs:
    get:
      summary: Get All Jobs
      description: Retrieve all job listings.
      tags:
        - Jobs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of jobs
          content:
            application/json:
              example:
                - company: "Google"
                  title: "Frontend Developer"
                  description: "React + Node"
                  salary: 150000

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          example: "60c72b2f9b1d8c001f8e4d1e"
        fullName:
          type: string
          example: "Rushitaben Vachhani"
        email:
          type: string
          format: email
          example: "rv@northeastern.edu"
        type:
          type: string
          enum: [admin, employee]
          example: "employee"

    Error:
      type: object
      properties:
        message:
          type: string
