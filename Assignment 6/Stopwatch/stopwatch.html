<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Stopwatch — Assignment 6</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="page">
    <header class="topbar">
      <div class="container">
        <h1 class="logo">Event Stopwatch</h1>
        <div class="spacer"></div>
      </div>
    </header>

    <main class="container">
      <section class="card center">
        <div class="timer" id="timer">00:00:00</div>

        <div class="details">
          <div class="grid">
            <div class="grid-col">
              <label for="date">Date</label>
              <input type="date" id="date" />
              <small class="error" id="dateError"></small>
            </div>
            <div class="grid-col">
              <label for="event">Event Name</label>
              <input
                type="text"
                id="event"
                placeholder="What are you timing?"
                maxlength="100"
              />
              <small class="error" id="eventError"></small>
            </div>
          </div>
        </div>

        <div class="btn-row">
          <button id="startBtn" class="btn btn--primary">Start</button>
          <button id="pauseBtn" class="btn" disabled>Pause</button>
          <button id="stopBtn" class="btn" disabled>Stop &amp; Save</button>
          <button id="resetBtn" class="btn btn--ghost">Reset</button>
        </div>
      </section>

      <section class="card">
        <header class="section-head">
          <h2>History</h2>
          <div class="filter">
            <label for="filterDate">Filter by date:</label>
            <input type="date" id="filterDate" />
            <button id="clearFilter" class="btn">Clear</button>
          </div>
        </header>
        <div id="stats" class="stats"></div>
        <ul id="history" class="history"></ul>
        <p id="emptyHistory" class="muted">No sessions recorded yet</p>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <footer class="footer">Part B • Stopwatch with Async/Await</footer>
    <script src="js/stopwatch.js"></script>
  </body>
</html>
