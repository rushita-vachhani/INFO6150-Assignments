<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Assignment 6</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="page page--auth">
    <main class="card">
      <h1 class="title">Calculator Login</h1>
      <p class="subtitle">Use your Northeastern email to continue.</p>

      <form id="loginForm" novalidate>
        <div class="form-row">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="yourname@northeastern.edu"
            autocomplete="username"
          />
          <small class="error" id="emailError"></small>
        </div>

        <div class="form-row">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="8+ characters"
            autocomplete="current-password"
          />
          <small class="error" id="passwordError"></small>
        </div>

        <div class="form-row form-row--inline">
          <label class="checkbox">
            <input type="checkbox" id="rememberMe" /> Remember me
          </label>
        </div>

        <button id="loginBtn" class="btn btn--primary" disabled>Login</button>
        <small class="error" id="credentialError"></small>
        <div
          id="successMsg"
          class="notice notice--success"
          style="display: none"
        >
          Login successful! Redirecting…
        </div>
      </form>
    </main>

    <script src="js/login.js"></script>
  </body>
</html>
