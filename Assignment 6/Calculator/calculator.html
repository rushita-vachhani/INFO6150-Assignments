<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator — Assignment 6</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="page">
    <header class="topbar">
      <div class="container">
        <h1 class="logo">Calculator</h1>
        <div class="spacer"></div>
        <div id="welcome" class="welcome"></div>
        <button id="logoutBtn" class="btn btn--ghost">Logout</button>
      </div>
    </header>

    <main class="container">
      <section class="card calc">
        <div class="grid">
          <div class="grid-col">
            <label for="num1">Number 1</label>
            <input type="text" id="num1" placeholder="e.g. 12.5 or -3" />
            <small class="error" id="num1Error"></small>
          </div>
          <div class="grid-col">
            <label for="num2">Number 2</label>
            <input type="text" id="num2" placeholder="e.g. 2 or -0.5" />
            <small class="error" id="num2Error"></small>
          </div>
        </div>

        <div class="btn-row">
          <button class="btn" data-op="add">+ Add</button>
          <button class="btn" data-op="subtract">- Subtract</button>
          <button class="btn" data-op="multiply">X Multiply</button>
          <button class="btn" data-op="divide">/ Divide</button>
        </div>

        <div class="result-row">
          <label for="result">Result</label>
          <input type="text" id="result" readonly />
        </div>
      </section>
    </main>

    <script src="js/calculator.js"></script>
  </body>
</html>
