openapi: 3.0.3
info:
  title: Assignment 8 Users API
  version: 1.0.0
servers:
  - url: http://localhost:4000
paths:
  /user/create:
    post:
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, password]
              properties:
                fullName: { type: string, example: John Doe }
                email: { type: string, format: email, example: john@example.com }
                password: { type: string, example: StrongP@ssw0rd }
      responses:
        "201": { description: User created successfully }
        "400": { description: Validation failed }
  /user/edit:
    put:
      summary: Update user's fullName and/or password by email (email cannot change)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                fullName: { type: string }
                password: { type: string }
      responses:
        "200": { description: User updated successfully }
        "400": { description: Validation failed }
        "404": { description: User not found }
  /user/delete:
    delete:
      summary: Delete a user by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: User deleted successfully }
        "404": { description: User not found }
  /user/getAll:
    get:
      summary: Retrieve all users (includes hashed passwords)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        fullName: { type: string }
                        email: { type: string }
                        password: { type: string }
  /user/uploadImage:
    post:
      summary: Upload an image (single per user; JPEG/PNG/GIF only)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [email, image]
              properties:
                email: { type: string, format: email }
                image: { type: string, format: binary }
      responses:
        "201": { description: Image uploaded successfully }
        "400": { description: Invalid file format or image already exists }
        "404": { description: User not found }
  /auth/login:
    post:
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { description: Login successful }
        "401": { description: Invalid credentials }
components: {}
