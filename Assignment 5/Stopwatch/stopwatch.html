<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Stopwatch</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <div id="timerDisplay" class="timer-display">00:00:00</div>
      <div id="eventDetails">
        <label for="eventDate">Date</label>
        <input type="date" id="eventDate" value="" />
        <div id="dateError" class="error-message"></div>

        <label for="eventName">Event Name</label>
        <input type="text" id="eventName" placeholder="What are you timing?" />
        <div id="eventNameError" class="error-message"></div>
      </div>

      <div id="controlButtons" class="button-group">
        <button id="startButton">Start</button>
        <button id="pauseResumeButton" disabled>Pause</button>
        <button id="stopSaveButton" disabled>Stop & Save</button>
        <button id="resetButton">Reset</button>
      </div>

      <hr />

      <h2>Session History</h2>

      <div id="statsDisplay" class="stats">
        Total Sessions: <span id="totalSessions">0</span> | Total Time:
        <span id="totalTime">00:00:00</span>
      </div>

      <ul id="sessionHistoryList"></ul>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/stopwatch.js"></script>
  </body>
</html>
